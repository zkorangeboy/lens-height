<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lens Height</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Lens Height</h1>
  </header>

  <main id="app">
    <div id="loading" class="notice">Loading gear…</div>

    <!-- No submit button: every change recomputes (SPEC.md 7.2). -->
    <form id="check-form" hidden>
      <section class="card target-card" aria-label="Target">
        <h2>Target height</h2>
        <div class="segmented" id="target-type-toggle" role="group" aria-label="Target type">
          <button type="button" id="target-fixed" class="segmented-btn is-active" aria-pressed="true">Height</button>
          <button type="button" id="target-range" class="segmented-btn" aria-pressed="false">Range</button>
        </div>

        <div id="fixed-target-fields">
          <label class="field">
            <span class="field-label">Lens height (in)</span>
            <input type="number" id="target-height" inputmode="decimal" step="0.25" placeholder="e.g. 32" />
          </label>
        </div>

        <div id="range-target-fields" class="range-fields" hidden>
          <label class="field">
            <span class="field-label">From (in)</span>
            <input type="number" id="target-low" inputmode="decimal" step="0.25" placeholder="e.g. 25" />
          </label>
          <label class="field">
            <span class="field-label">To (in)</span>
            <input type="number" id="target-high" inputmode="decimal" step="0.25" placeholder="e.g. 40" />
          </label>
          <p class="hint">A range is a move during the take, so only gear that can move live counts.</p>
        </div>
      </section>

      <!-- Sticky, so the answer stays in view while you change picks below. -->
      <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>

      <section id="result-body" class="result-body" aria-label="Result"></section>

      <section id="stack-card" class="card" aria-label="Rig, floor to lens"></section>

      <section id="picks" class="card" aria-label="Rig picks"></section>
    </form>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
