<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lens Height</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Lens Height</h1>
  </header>

  <main>
    <div id="loading" class="notice">Loading gear…</div>

    <!-- No submit button: every change recomputes (SPEC.md 7.2). -->
    <div id="app" hidden>
      <section class="target" aria-label="Target">
        <div class="segmented" role="group" aria-label="Target type">
          <button type="button" id="target-fixed" class="segmented-btn is-active" aria-pressed="true">Height</button>
          <button type="button" id="target-range" class="segmented-btn" aria-pressed="false">Range</button>
        </div>
        <div id="fixed-target-fields" class="target-fields">
          <input type="number" id="target-height" inputmode="decimal" step="0.25" placeholder="Lens height" aria-label="Lens height, inches" />
          <span class="unit">in</span>
        </div>
        <div id="range-target-fields" class="target-fields" hidden>
          <input type="number" id="target-low" inputmode="decimal" step="0.25" placeholder="From" aria-label="Move from, inches" />
          <span class="unit">to</span>
          <input type="number" id="target-high" inputmode="decimal" step="0.25" placeholder="To" aria-label="Move to, inches" />
          <span class="unit">in</span>
        </div>
      </section>
      <p id="range-hint" class="hint" hidden>A range is a live move: only moveable gear counts.</p>

      <p id="verdict" class="verdict" role="status" aria-live="polite"></p>

      <p id="placing-hint" class="placing-hint" role="status" hidden></p>
      <section id="rig" class="rig" aria-label="The rig, floor to lens. Tap a piece to change it."></section>
      <button type="button" id="add-button" class="add-button" data-add="">+ Add to the rig</button>
      <p id="rig-footer" class="rig-footer"></p>
    </div>

    <!-- Why the last change moved something else: a toast, so the drawing doesn't jump. -->
    <div id="notes" class="notes" role="status" hidden>
      <ul id="notes-list"></ul>
      <button type="button" class="notes-close" data-dismiss-notes aria-label="Dismiss">×</button>
    </div>

    <p id="version" class="version-note"></p>

    <dialog id="sheet" class="sheet" aria-label="Change the rig"></dialog>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
